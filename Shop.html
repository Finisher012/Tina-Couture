<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop | Tinah Couture</title>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<nav class="navbar">

<div class="logo">
Tinah <span>Couture</span>
</div>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="shop.html" class="active">Shop</a></li>

<li><a href="collections.html">Collections</a></li>

<li><a href="about.html">About</a></li>

<li><a href="contact.html">Contact</a></li>

<li><a href="cart.html"><i class="fas fa-shopping-bag"></i></a></li>

</ul>

</nav>

</header>

<section class="shop-header">

<h1>Luxury Collection</h1>

<p>Discover timeless elegance crafted for every occasion.</p>

</section>

<section class="search-area">

<input
type="text"
id="searchInput"
placeholder="Search products...">

<select id="categoryFilter">

<option value="all">All Categories</option>

<option value="Dress">Dress</option>

<option value="Suit">Suit</option>

<option value="Bag">Bag</option>

<option value="Shoes">Shoes</option>

</select>

</section>

<section class="products" id="products">
<main class="shop-container">

    <!-- Sidebar -->
    <aside class="shop-sidebar">

        <h2>Filters</h2>

        <div class="filter-group">
            <h3>Categories</h3>

            <label><input type="checkbox"> Dresses</label>
            <label><input type="checkbox"> Men</label>
            <label><input type="checkbox"> Shoes</label>
            <label><input type="checkbox"> Accessories</label>
        </div>

        <div class="filter-group">
            <h3>Price</h3>

            <input type="range">
        </div>

        <div class="filter-group">
            <h3>Size</h3>

            <button>S</button>
            <button>M</button>
            <button>L</button>
            <button>XL</button>
        </div>

    </aside>

    <!-- Products -->

    <section class="shop-content">

        <div class="shop-top">

            <input
                id="searchBox"
                type="text"
                placeholder="Search products...">

            <select id="sortProducts">

                <option>Newest</option>

                <option>Price Low-High</option>

                <option>Price High-Low</option>

                <option>Popularity</option>

            </select>

        </div>

        <div
            id="products"
            class="products-grid">

        </div>

    </section>

</main>
</section>

<script src="assets/js/shop.js"></script>
<script src="assets/js/product.js"></script>
</body>
</html>
